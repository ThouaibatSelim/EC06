name: CI/CD SkillHub V2

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    name: Install, Lint, Test, Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Install ────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skillhub-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: skillhub-frontend
        run: npm install

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo, pdo_sqlite, sqlite3, mongodb-1.20.0
          tools: php-cs-fixer
          coverage: none

      - name: Install backend dependencies
        working-directory: skillhub-backend
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-mongodb

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Rendre mvnw exécutable
        working-directory: skillhub-auth
        run: chmod +x mvnw

      - name: Install Spring Boot dependencies
        working-directory: skillhub-auth
        run: ./mvnw install -DskipTests -B

      # ── Lint ───────────────────────────────────────────────────
      - name: Lint frontend
        working-directory: skillhub-frontend
        run: npm run lint

      - name: Lint backend (php-cs-fixer)
        working-directory: skillhub-backend
        run: php-cs-fixer fix --dry-run --diff

      # ── Test ───────────────────────────────────────────────────
      - name: Run Laravel tests
        working-directory: skillhub-backend
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: ${{ secrets.APP_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_SERVICE_URL: http://skillhub-auth:8080
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          MONGO_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: skillhub_logs_test

      - name: Run Spring Boot tests
        working-directory: skillhub-auth
        run: ./mvnw test -B
        env:
          APP_MASTER_KEY: test_master_key_for_ci_only_32c
          JWT_SECRET: test_jwt_secret_for_ci_only

      # ── SonarCloud (les deux projets requis par le sujet : Laravel + Spring Boot) ─
      - name: SonarCloud analysis — backend (Laravel)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: skillhub-backend

      - name: SonarCloud analysis — auth (Spring Boot)
        working-directory: skillhub-auth
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw sonar:sonar
          -Dsonar.projectKey=ThouaibatSelim_EC062
          -Dsonar.organization=thouaibatselim
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # ── Build images (Laravel + Spring Boot, taguées au SHA) ──
      - name: Build backend image
        run: docker build -t skillhub-api:${{ github.sha }} ./skillhub-backend

      - name: Build auth (Spring Boot) image
        run: docker build -t skillhub-auth:${{ github.sha }} ./skillhub-auth

      - name: Build frontend image
        run: docker build -t skillhub-frontend:${{ github.sha }} ./skillhub-frontend

  cd:
    name: Push images to registry
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.REGISTRY_USER }}/skillhub-api:${{ github.sha }} ./skillhub-backend
          docker push ${{ secrets.REGISTRY_USER }}/skillhub-api:${{ github.sha }}

      - name: Build and push auth (Spring Boot) image
        run: |
          docker build -t ${{ secrets.REGISTRY_USER }}/skillhub-auth:${{ github.sha }} ./skillhub-auth
          docker push ${{ secrets.REGISTRY_USER }}/skillhub-auth:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.REGISTRY_USER }}/skillhub-frontend:${{ github.sha }} ./skillhub-frontend
          docker push ${{ secrets.REGISTRY_USER }}/skillhub-frontend:${{ github.sha }}